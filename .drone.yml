---
kind: pipeline
type: docker
name: default

trigger:
  branch:
    - main
  event:
    - push
    - custom

steps:
  - name: install
    image: oven/bun:1
    commands:
      - bun install --frozen-lockfile

  - name: build
    image: oven/bun:1
    commands:
      - bun run build

  - name: deploy
    image: alpine
    volumes:
      - name: output
        path: /var/shared
    commands:
      - rm -rf /var/shared/*
      - cp -r dist/* /var/shared

volumes:
  - name: output
    host:
      path: /root/services/shared/hunterjisha-com
